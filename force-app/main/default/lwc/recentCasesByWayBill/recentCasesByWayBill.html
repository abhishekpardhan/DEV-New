<!-- sldsValidatorIgnore -->
<template>
        <div if:true={isSpinnerShow} id='spinner-info-section' class="slds-text-align_center slds-var-p-around_medium">
                <lightning-spinner class="slds-split-view_container slds-p-top--large" variant="brand"
                        alternative-text="Loading" size="small"></lightning-spinner>
        </div>
        <div id="table-section" if:false={isSpinnerShow}>
                <h3 class="slds-p-bottom--x-small slds-text-heading_label-normal">Showing {recordLimit} Recent Cases
                        With Waybill #{wayBillNumber}</h3>
                <div if:true={caseData} style="height: 300px;">
                        <lightning-datatable key-field="id" hide-checkbox-column data={caseData} columns={columns}>
                        </lightning-datatable>
                </div>
                <div if:false={caseData} class="slds-text-align--center slds-text-color_destructive">
                        No Case Found, Please Close.
                </div>
        </div>
</template>
