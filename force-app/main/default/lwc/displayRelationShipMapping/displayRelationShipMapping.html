<template>
    <lightning-card title={objectLabel}>
        <!-- Data Table -->
        <lightning-datatable
            key-field="Id"
            data={paginatedData} 
            columns={columns}
            hide-checkbox-column="true"
            onrowaction={handleRowSelection}
            max-row-selection="1">
        </lightning-datatable>

        <!-- Pagination Controls -->
        <div class="slds-m-top_medium slds-grid slds-grid_align-center">
            <lightning-button
                label="Previous"
                onclick={handlePreviousPage}
                disabled={isPreviousButtonDisabled}>
            </lightning-button>

            <div class="slds-m-horizontal_medium">
                Page {currentPage} of {totalPages}
            </div>

            <lightning-button
                label="Next"
                onclick={handleNextPage}
                disabled={isNextButtonDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
