<template>
    <div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div id="box" class={boxClass} aria-expanded="true" aria-haspopup="listbox" role="combobox">
                    <label class="slds-form-element__label slds-no-flex"><span class="slds-required">*</span>SFX/PRC/Rate Card</label>
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                            <template if:true={isValueSelected}>
                                <div class="slds-combobox_container slds-has-selection">
                                    <div class="lookupInputContainer slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
                                        aria-expanded="false" aria-haspopup="listbox" role="combobox">
                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                                            role="none">
                                            <!--Lookup Selected record pill container start-->
                                            <div class="pillDiv">
                                                <span class="slds-icon_container slds-combobox__input-entity-icon">
                                                    <lightning-icon icon-name={iconName} size="x-small" alternative-text="icon">
                                                    </lightning-icon>
                                                </span>
                                                <!-- sldsValidatorIgnoreNextLine -->
                                                <input type="text" id="combobox-id-1" value={selectedName}
                                                    class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                                                <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                                    title="Remove selected option">
                                                    <lightning-icon icon-name="utility:close" size="x-small" alternative-text="close icon"
                                                        onclick={handleRemovePill}></lightning-icon>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </template>
                            <template if:false={isValueSelected}>
                                <div class="slds-p-top_none">
                                    <lightning-input class={inputClass} type="search" id="input" value={searchTerm}
                                                    onclick={handleClick} onblur={onBlur} onchange={onChange}
                                                    variant="label-hidden" autocomplete="off" placeholder={searchPlaceholder}>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>
                        <div id="listbox-id-1" class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={records} for:item="record">
                                    <li key={record.Id} onclick={onSelect} data-id={record.Id} role="presentation" data-name={record.Rate_Card_Formula__c}>
                                        <span class="slds-lookup__item-action slds-lookup__item-action--label" role="option">
                                            <lightning-icon class="slds-icon slds-icon--small slds-icon-text-default" icon-name={iconName} alternative-text={objName} size="small"></lightning-icon>
                                            <span class="slds-truncate">{record.Rate_Card_Formula__c}</span>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
