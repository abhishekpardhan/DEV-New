<template>
    <lightning-card title="Search and Add Leads to Campaign">
        <div class="card-container">
            <!-- SCROLLABLE CONTENT -->
            <div class="card-body">
                <!-- SEARCH INPUT -->
                <div class="slds-grid slds-gutters slds-align-end">
                    <div class="slds-col slds-size_9-of-12">
                        <lightning-input 
                            value={searchKey}
                            onchange={handleSearchKeyChange}
                            placeholder="Search Lead/Phone/Email"
                            variant="label-hidden">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_3-of-12">
                        <lightning-button 
                            label="Search" 
                            onclick={handleSearch} 
                            class="slds-button">
                        </lightning-button>
                    </div>
                </div>

                <!-- LEAD RESULTS -->
                <template if:true={leadResults}>
                    <div class="slds-m-top_medium">
                        <div class="slds-grid slds-gutters slds-text-title_bold slds-m-bottom_x-small">
                            <div class="slds-col slds-size_1-of-12"></div>
                            <div class="slds-col slds-size_3-of-12">Name</div>
                            <div class="slds-col slds-size_3-of-12">Email</div>
                            <div class="slds-col slds-size_2-of-12">Phone</div>
                            <div class="slds-col slds-size_3-of-12">Remarks</div>
                        </div>

                        <template for:each={leadResults} for:item="lead">
                            <div key={lead.Id} class="slds-grid slds-gutters slds-m-bottom_x-small slds-align-middle">
                                <div class="slds-col slds-size_1-of-12">
                                    <lightning-input 
                                        type="checkbox" 
                                        data-id={lead.Id} 
                                        onchange={handleCheckboxChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_3-of-12">{lead.Name}</div>
                                <div class="slds-col slds-size_3-of-12">{lead.Email__c}</div>
                                <div class="slds-col slds-size_2-of-12">{lead.Phone__c}</div>
                                <div class="slds-col slds-size_3-of-12" style="margin-top: -20px;">
                                    <lightning-input 
                                        type="text" 
                                        data-id={lead.Id} 
                                        placeholder="Remarks" 
                                        onchange={handleRemarksChange}>
                                    </lightning-input>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- FIXED FOOTER INSIDE CARD -->
            <div class="card-footer">
                <lightning-button 
                    label="Save to Campaign" 
                    onclick={handleSave} 
                    variant="brand">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
