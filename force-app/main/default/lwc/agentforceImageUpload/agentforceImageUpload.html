<template>
    <div class="sfx-card">
        <!-- Header -->
        <div class="sfx-header">
            <img src={logoUrl} alt="Safexpress" class="sfx-logo" />
            <h2 class="sfx-title">Post Delivery Complaint</h2>
        </div>

        <div class="sfx-body">
            <!-- ================= FORM VIEW ================= -->
            <template lwc:if={showForm}>
                <p class="sfx-instruction">
                    Please share your details along with Images or PDF to raise a complaint
                </p>

                <!-- Progress -->
                <div class="sfx-progress-track" aria-hidden="true">
                    <div class="sfx-progress-fill" style={progressStyle}></div>
                </div>
                <p class="sfx-progress-label">{completedCount} of {totalSteps} completed</p>

                <!-- ===== Section 1: Your issue ===== -->
                <div class="sfx-section-title">
                    <span>Your issue</span>
                    <span class="sfx-section-line"></span>
                </div>

                <div class="sfx-steps">
                    <div class={issueStepClass}>
                        <span class="sfx-dot"></span>
                        <div class="sfx-step-body">
                            <label class="sfx-label" for="sfx-issue">
                                <span class="sfx-req">*</span>📝 Issue Type
                            </label>
                            <div class="sfx-input-wrap">
                                <select
                                    id="sfx-issue"
                                    class="sfx-input sfx-select"
                                    data-field="issueType"
                                    disabled={isBusy}
                                    onchange={handleInputChange}
                                    onblur={handleBlur}>
                                    <option value="" selected={isNoIssueSelected}>Select the issue you are facing</option>
                                    <template for:each={issueOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                            <template lwc:if={issueError}>
                                <p class="sfx-field-error">{issueError}</p>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- ===== Section 2: Your details ===== -->
                <div class="sfx-section-title">
                    <span>Your details</span>
                    <span class="sfx-section-line"></span>
                </div>

                <div class="sfx-steps">
                    <!-- Waybill -->
                    <div class={waybillStepClass}>
                        <span class="sfx-dot"></span>
                        <div class="sfx-step-body">
                            <label class="sfx-label" for="sfx-waybill">
                                <span class="sfx-req">*</span>📦 Waybill Number
                            </label>
                            <div class="sfx-input-wrap">
                                <input
                                    id="sfx-waybill"
                                    class="sfx-input"
                                    data-field="waybill"
                                    type="text"
                                    inputmode="numeric"
                                    maxlength="14"
                                    placeholder="12-digit waybill number"
                                    value={waybill}
                                    disabled={isBusy}
                                    oninput={handleInputChange}
                                    onblur={handleBlur} />
                                <template lwc:if={isChecking}>
                                    <span class="sfx-input-spinner"></span>
                                </template>
                                <span class="sfx-check">✓</span>
                            </div>
                            <template lwc:if={waybillError}>
                                <p class="sfx-field-error">{waybillError}</p>
                            </template>
                            <template lwc:if={isChecking}>
                                <p class="sfx-checking-text">Checking waybill...</p>
                            </template>

                            <!-- Not delivered / API error -->
                            <template lwc:if={showCheckBanner}>
                                <div class={checkBannerClass} role="alert">
                                    <span class="sfx-banner-icon">⚠️</span>
                                    <span>{checkMessage}</span>
                                </div>
                            </template>

                            <!-- Same issue already open -->
                            <template lwc:if={isOpenCaseMode}>
                                <div class="sfx-open-case" role="status">
                                    <p class="sfx-open-case-title">ℹ️ {openCase.message}</p>
                                    <div class="sfx-open-case-rows">
                                        <div class="sfx-open-case-row">
                                            <span>🎫 Case Number</span>
                                            <strong>{openCase.caseNumber}</strong>
                                        </div>
                                        <div class="sfx-open-case-row">
                                            <span>📝 Issue Type</span>
                                            <strong>{openCase.issueLabel}</strong>
                                        </div>
                                        <div class="sfx-open-case-row">
                                            <span>🚚 Status</span>
                                            <strong>{openCase.caseStatus}</strong>
                                        </div>
                                        <div class="sfx-open-case-row">
                                            <span>🕒 Created On</span>
                                            <strong>{openCase.createdOn}</strong>
                                        </div>
                                    </div>
                                    <p class="sfx-open-case-hint">{openCaseDocsHint}</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <template lwc:if={showDetailsSections}>

                    <!-- Mobile -->
                    <div class={mobileStepClass}>
                        <span class="sfx-dot"></span>
                        <div class="sfx-step-body">
                            <label class="sfx-label" for="sfx-mobile">
                                <span class="sfx-req">*</span>📱 Mobile Number
                            </label>
                            <div class="sfx-input-wrap">
                                <input
                                    id="sfx-mobile"
                                    class="sfx-input"
                                    data-field="mobile"
                                    type="tel"
                                    inputmode="numeric"
                                    maxlength="10"
                                    placeholder="10-digit mobile number"
                                    value={mobile}
                                    disabled={isDetailsLocked}
                                    oninput={handleInputChange}
                                    onblur={handleBlur} />
                                <span class="sfx-check">✓</span>
                            </div>
                            <template lwc:if={mobileError}>
                                <p class="sfx-field-error">{mobileError}</p>
                            </template>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class={emailStepClass}>
                        <span class="sfx-dot"></span>
                        <div class="sfx-step-body">
                            <label class="sfx-label" for="sfx-email">
                                <span class="sfx-req">*</span>✉️ Email ID
                            </label>
                            <div class="sfx-input-wrap">
                                <input
                                    id="sfx-email"
                                    class="sfx-input"
                                    data-field="email"
                                    type="email"
                                    inputmode="email"
                                    placeholder="name@example.com"
                                    value={email}
                                    disabled={isDetailsLocked}
                                    oninput={handleInputChange}
                                    onblur={handleBlur} />
                                <span class="sfx-check">✓</span>
                            </div>
                            <template lwc:if={emailError}>
                                <p class="sfx-field-error">{emailError}</p>
                            </template>
                        </div>
                    </div>
                    </template>
                </div>

                <!-- ===== Section 3: Complaint details ===== -->
                <div class="sfx-section-title">
                    <span>Complaint details</span>
                    <span class="sfx-section-line"></span>
                </div>

                <div class="sfx-steps">
                    <template lwc:if={showDetailsSections}>
                    <!-- Description -->
                    <div class={descriptionStepClass}>
                        <span class="sfx-dot"></span>
                        <div class="sfx-step-body">
                            <label class="sfx-label" for="sfx-description">
                                <template lwc:if={isDescriptionRequired}>
                                    <span class="sfx-req">*</span>
                                </template>
                                💬 Describe what happened
                                <template lwc:if={isDescriptionOptional}>
                                    <span class="sfx-optional">(optional)</span>
                                </template>
                            </label>
                            <textarea
                                id="sfx-description"
                                class="sfx-input sfx-textarea"
                                data-field="description"
                                rows="3"
                                maxlength="2000"
                                placeholder={descriptionPlaceholder}
                                value={description}
                                disabled={isDetailsLocked}
                                oninput={handleInputChange}
                                onblur={handleBlur}></textarea>
                            <div class="sfx-counter-row">
                                <template lwc:if={descriptionError}>
                                    <p class="sfx-field-error">{descriptionError}</p>
                                </template>
                                <span class="sfx-counter">{descriptionLength}/2000</span>
                            </div>
                        </div>
                    </div>

                    <!-- Incident date (staff behaviour only) -->
                    <template lwc:if={isStaffIssue}>
                        <div class={incidentDateStepClass}>
                            <span class="sfx-dot"></span>
                            <div class="sfx-step-body">
                                <label class="sfx-label" for="sfx-date">
                                    📅 Date of incident <span class="sfx-optional">(optional)</span>
                                </label>
                                <div class="sfx-input-wrap">
                                    <input
                                        id="sfx-date"
                                        class="sfx-input"
                                        data-field="incidentDate"
                                        type="date"
                                        max={todayIso}
                                        value={incidentDate}
                                        disabled={isDetailsLocked}
                                        onchange={handleInputChange}
                                        onblur={handleBlur} />
                                </div>
                                <template lwc:if={incidentDateError}>
                                    <p class="sfx-field-error">{incidentDateError}</p>
                                </template>
                            </div>
                        </div>
                    </template>
                    </template>

                    <!-- Supporting documents -->
                    <div class={filesStepClass}>
                        <span class="sfx-dot"></span>
                        <div class="sfx-step-body">
                            <p class="sfx-label">
                                <template lwc:if={isDocsRequired}>
                                    <span class="sfx-req">*</span>
                                </template>
                                📎 Supporting Documents (PNG, JPEG or PDF)
                                <template lwc:if={isDocsOptional}>
                                    <span class="sfx-optional">(optional)</span>
                                </template>
                            </p>

                            <label
                                class={dropZoneClass}
                                ondragenter={handleDragOver}
                                ondragover={handleDragOver}
                                ondragleave={handleDragLeave}
                                ondrop={handleDrop}>
                                <input
                                    class="sfx-file-input"
                                    type="file"
                                    multiple
                                    accept=".jpg,.jpeg,.png,.pdf,image/png,image/jpeg,application/pdf"
                                    disabled={isDocsLocked}
                                    onchange={handleFileChange} />
                                <span class="sfx-drop-icon">📤</span>
                                <span class="sfx-drop-text">
                                    <strong>Click to upload</strong> or drag &amp; drop
                                </span>
                                <span class="sfx-drop-hint">Photos are compressed automatically. PDFs up to 2 MB each.</span>
                            </label>

                            <template lwc:if={hasFiles}>
                                <div class="sfx-file-list">
                                    <template for:each={files} for:item="file">
                                        <div key={file.id} class="sfx-file-chip">
                                            <span class="sfx-file-emoji">{file.emoji}</span>
                                            <span class="sfx-file-name" title={file.name}>{file.name}</span>
                                            <span class="sfx-file-size">{file.sizeLabel}</span>
                                            <button
                                                type="button"
                                                class="sfx-remove-btn"
                                                title="Remove file"
                                                data-id={file.id}
                                                disabled={isBusy}
                                                onclick={handleRemoveFile}>
                                                ✕
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <template lwc:if={errorMessage}>
                    <div class="sfx-error" role="alert">{errorMessage}</div>
                </template>

                <template lwc:if={isBusy}>
                    <div class="sfx-busy">
                        <span class="sfx-spinner"></span>
                        <span>{progressText}</span>
                    </div>
                </template>

                <!-- DYNAMIC PROMPT FOR AGENTFORCE SUBMIT BUTTON -->
                <div class="sfx-submit-prompt" style="text-align: center; margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 4px;">
                    <template lwc:if={isSubmitDisabled}>
                        <p class="sfx-hint" style="color: #666; font-size: 0.9em; margin: 0;">Please complete all required fields to activate the Submit button below.</p>
                    </template>
                    <template lwc:else>
                        <p class="sfx-ready-hint" style="color: #2e844a; font-weight: 600; margin: 0;">✅ All details provided. Please click the grey "Submit" button below to log your request.</p>
                    </template>
                </div>
            </template>

            <!-- ================= RESULT VIEW ================= -->
            <template lwc:else>
                <div class="sfx-confirm-note">{confirmNote}</div>

                <div class="sfx-result">
                    <lightning-icon
                        icon-name={resultIcon}
                        variant={resultVariant}
                        size="medium"
                        class="sfx-result-icon">
                    </lightning-icon>
                    <p class="sfx-result-message">{result.message}</p>

                    <div class="sfx-details">
                        <template lwc:if={result.caseNumber}>
                            <div class="sfx-detail-row">
                                <span class="sfx-detail-label">🎫 Case Number</span>
                                <span class="sfx-detail-value">{result.caseNumber}</span>
                            </div>
                        </template>
                        <template lwc:if={result.issueLabel}>
                            <div class="sfx-detail-row">
                                <span class="sfx-detail-label">📝 Issue Type</span>
                                <span class="sfx-detail-value">{result.issueLabel}</span>
                            </div>
                        </template>
                        <div class="sfx-detail-row">
                            <span class="sfx-detail-label">📦 Waybill Number</span>
                            <span class="sfx-detail-value">{result.waybillFormatted}</span>
                        </div>
                        <template lwc:if={result.caseStatus}>
                            <div class="sfx-detail-row">
                                <span class="sfx-detail-label">🚚 Status</span>
                                <span class="sfx-detail-value">{result.caseStatus}</span>
                            </div>
                        </template>
                        <template lwc:if={result.createdOn}>
                            <div class="sfx-detail-row">
                                <span class="sfx-detail-label">🕒 Created On</span>
                                <span class="sfx-detail-value">{result.createdOn}</span>
                            </div>
                        </template>
                        <template lwc:if={hasFilesAttached}>
                            <div class="sfx-detail-row">
                                <span class="sfx-detail-label">📎 Supporting Documents</span>
                                <span class="sfx-detail-value">{result.filesAttached}</span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer -->
        <div class="sfx-footer">
            <div class="sfx-footer-heading">
                <span class="sfx-footer-line"></span>
                <span class="sfx-footer-title">Get the Safexpress App</span>
                <span class="sfx-footer-line"></span>
            </div>

            <div class="sfx-app-badges">
                <a
                    class="sfx-badge-link"
                    href={androidAppUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Get it on Google Play">
                    <img src={androidBadgeUrl} alt="Get it on Google Play" class="sfx-badge" />
                </a>
                <a
                    class="sfx-badge-link"
                    href={iosAppUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Download on the App Store">
                    <img src={iosBadgeUrl} alt="Download on the App Store" class="sfx-badge" />
                </a>
            </div>

            <div class="sfx-footer-heading sfx-footer-tagline-row">
                <span class="sfx-footer-line"></span>
                <span class="sfx-footer-tagline">One App, All Solutions, Always with You</span>
                <span class="sfx-footer-line"></span>
            </div>
        </div>
    </div>
</template>
