<template>
    <div class="slds-modal slds-fade-in-open slds-backdrop slds-modal--large">
        <div class="slds-modal__container">
            <!-- HEADER Section-->
            <div class="slds-modal__header">
                <lightning-button-icon icon-name="utility:close" alternative-text="Close this window" size="large"
                    variant="bare-inverse" onclick={closeModal} class="slds-modal__close">
                </lightning-button-icon>
                <h2>{headerText}</h2>
            </div>
            <!--Body Section-->

            <div class="slds-modal__content slds-var-p-around_medium" if:false ={isTrackHistory}>
                <c-recent-cases-by-way-bill way-bill-number={wayBillNumber} record-limit={recordLimit}></c-recent-cases-by-way-bill>
            </div>
            <div class="slds-modal__content slds-var-p-around_medium" if:true ={isTrackHistory}>
                <c-way-bill-track-table track-data={trackData} ></c-way-bill-track-table>
            </div>  
            <!--Footer Section-->
            <div class="slds-modal__footer">
                <lightning-button label="Close" variant="brand" onclick={closeModal}></lightning-button>
            </div>
        </div>
    </div>
</template>
